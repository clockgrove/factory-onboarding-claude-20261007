name: Fixture quality
on: [pull_request]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --check src/parse-tasks.mjs && node --check src/tasks.mjs && node scripts/check.mjs
